# Example nginx settings for the Harbor Ops website (any static host works; these are the settings that matter).
server {
    listen 80;
    server_name www.harborops.co.uk;
    root /var/www/harbor-ops-website;     # the folder with index.html
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    error_page 404 /404.html;

    # Pages: always check for a newer version. Short addresses work too (/login, /signup, /privacy …).
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Images, styles and scripts: cached for a week. They carry ?v= versions in the HTML,
    # so a changed file shows straight away once its ?v= value is changed.
    location ~* \.(?:css|js|webp|jpe?g|png|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
}
