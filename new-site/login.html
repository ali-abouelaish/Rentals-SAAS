<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Harbor Ops</title>
<meta name="description" content="Sign in to your Harbor Ops workspace.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#19363A">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/brand/harbor-emblem-teal.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/door/letterbox-open.webp">
<link rel="stylesheet" href="css/auth.css?v=20261009m">
<script>document.documentElement.classList.add('js');</script>
<script src="js/auth.js?v=20261009a" defer></script>
</head>
<!-- Design for the app's /login page. Field names match the current page (email, password, stay_signed_in).
     data-preview: not connected yet; see js/auth.js before taking it live. -->
<body>
<div class="hall" aria-hidden="true"><img src="assets/door/hallway.webp" alt="" width="1376" height="768" decoding="async"></div>
<div class="frame frame--l" aria-hidden="true"></div><div class="frame frame--r" aria-hidden="true"></div>

<div class="stage">
  <div class="door" id="door">
    <header class="door__top rise" style="--d:0">
      <a class="back" href="./"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M15 8H2M7 3 2 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Back to site</a>
      <p class="switch"><span>New to Harbor? </span><a href="signup.html">Request a demo</a></p>
    </header>

    <div class="door__upper">
      <i class="panel panel--l" aria-hidden="true"><i></i></i><i class="panel panel--r" aria-hidden="true"><i></i></i>
      <img class="knocker" src="assets/door/knocker.webp" alt="" aria-hidden="true" width="480" height="608">
      <main class="plate rise" style="--d:1" id="main">
        <span class="screw screw--tl" aria-hidden="true"></span><span class="screw screw--tr" aria-hidden="true"></span><span class="screw screw--bl" aria-hidden="true"></span><span class="screw screw--br" aria-hidden="true"></span>
        <img class="plate__mark" src="assets/brand/harbor-logo-teal.svg" alt="Harbor Ops" width="118" height="29">
        <h1 class="plate__title">Welcome back.</h1>
        <p class="plate__sub">Your rooms are right where you left them.</p>
        <div class="alert" id="formAlert" role="alert" tabindex="-1" hidden></div>
        <form class="form" data-auth="login" data-preview method="post" novalidate>
          <div class="field">
            <label for="login-email">Work email</label>
            <input class="input" id="login-email" name="email" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="name@agency.co.uk" required>
            <p class="field__error" id="login-email-error" hidden></p>
          </div>
          <div class="field">
            <div class="field__row"><label for="login-password">Password</label><a class="field__link" href="https://www.harborops.co.uk/forgot-password">Forgot password?</a></div>
            <div class="field__control">
              <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
              <button class="reveal" type="button" aria-controls="login-password" aria-pressed="false" aria-label="Show password"><svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.5 17.5 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
            </div>
            <p class="field__hint" id="capsHint" role="status" hidden>Caps Lock is on</p>
            <p class="field__error" id="login-password-error" hidden></p>
          </div>
          <label class="check"><input type="checkbox" name="stay_signed_in" checked><span class="check__box"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Keep me signed in on this device</span></label>
          <button class="submit" type="submit"><span class="spin" aria-hidden="true"></span><span class="submit__label">Sign in</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h13M9 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </form>
        <p class="sr-only" id="formStatus" role="status"></p>
      </main>
    </div>

    <div class="door__lock" aria-hidden="true">
      <div class="letterbox"><img src="assets/door/letterbox-open.webp" alt="" width="1008" height="378"><img class="letterbox__flap" src="assets/door/flap.webp" alt="" width="1008" height="378"></div>
      <img class="knob" src="assets/door/knob.webp" alt="" width="396" height="396">
    </div>
    <div class="door__lower" aria-hidden="true"><i class="panel panel--l" aria-hidden="true"><i></i></i><i class="panel panel--r" aria-hidden="true"><i></i></i></div>

    <footer class="door__foot">
      <p>© 2026 Harbor Ops · London, UK</p>
      <nav aria-label="Contact and legal"><a href="mailto:info@harborops.co.uk">info@harborops.co.uk</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav>
    </footer>
  </div>
</div>
<div class="welcome" id="welcome" hidden>
  <span class="spin" aria-hidden="true"></span><span role="status">Welcome back. Opening your workspace…</span>
  <button type="button" id="closeDoor">Close the door</button>
</div>
</body>
</html>
